<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbitrage Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { color: #58a6ff; margin-bottom: 10px; font-size: 28px; }
        .subtitle { color: #8b949e; margin-bottom: 30px; font-size: 14px; }
        .controls {
            display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap;
            align-items: flex-end;
        }
        .controls > div { display: flex; flex-direction: column; gap: 4px; }
        .controls label { color: #8b949e; font-size: 12px; }
        .controls input, .controls select {
            background: #161b22; border: 1px solid #30363d;
            color: #c9d1d9; padding: 8px 12px; border-radius: 6px; font-size: 14px;
        }
        .controls button {
            background: #238636; color: white; border: none;
            padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px;
            height: 36px;
        }
        .controls button:hover { background: #2ea043; }
        .status { color: #8b949e; font-size: 12px; margin-bottom: 20px; }
        
        /* Debug Panel */
        .debug-panel {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            max-height: 200px;
            overflow-y: auto;
        }
        .debug-panel h3 {
            color: #58a6ff;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .debug-line {
            color: #8b949e;
            margin: 3px 0;
            word-break: break-all;
        }
        .debug-line.error { color: #f85149; }
        .debug-line.success { color: #3fb950; }
        .debug-line.info { color: #58a6ff; }
        
        table {
            width: 100%; border-collapse: collapse;
            background: #161b22; border-radius: 8px; overflow: hidden;
        }
        th {
            background: #21262d; color: #58a6ff;
            padding: 12px; text-align: left; font-size: 13px; font-weight: 600;
        }
        td {
            padding: 12px; border-bottom: 1px solid #21262d; font-size: 13px;
        }
        tr:hover { background: #1c2128; }
        .profit { color: #3fb950; font-weight: 600; }
        .loss { color: #f85149; }
        .neutral { color: #8b949e; }
        .token-name { font-weight: 600; color: #c9d1d9; }
        .price { font-family: 'Courier New', monospace; }
        .no-data { text-align: center; padding: 40px; color: #8b949e; }
        .loading { text-align: center; padding: 40px; color: #58a6ff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Arbitrage Tracker</h1>
        <p class="subtitle">HE ve TD arasındaki fiyat farklarını anlık olarak takip edin</p>
        
        <div class="controls">
            <div>
                <label>Minimum Kâr (%):</label>
                <input type="number" id="minProfit" value="0" min="0" step="0.1">
            </div>
            <div>
                <label>Swap Ücreti (%):</label>
                <input type="number" id="swapFee" value="0.3" min="0" step="0.1">
            </div>
            <div>
                <label>Filtre:</label>
                <select id="filter">
                    <option value="all">Tümü</option>
                    <option value="profit">Sadece Kârlı</option>
                </select>
            </div>
            <button onclick="fetchData()">Yenile</button>
        </div>
        
        <div class="status" id="status">Yükleniyor...</div>
        
        <!-- Debug Paneli -->
        <div class="debug-panel" id="debugPanel">
            <h3>🔍 Debug Bilgisi</h3>
            <div id="debugContent">Başlatılıyor...</div>
        </div>
        
        <table id="arbitrageTable">
            <thead>
                <tr>
                    <th>Token</th>
                    <th>HE Satış (Ask)</th>
                    <th>HE Alış (Bid)</th>
                    <th>TD Fiyat</th>
                    <th>HE→TD Kâr</th>
                    <th>TD→HE Kâr</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="6" class="loading">Veriler yükleniyor...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const HIVE_ENGINE_API = 'https://api.hive-engine.com/rpc/contracts';
        let updateInterval;

        function logDebug(message, type = 'info') {
            const content = document.getElementById('debugContent');
            const line = document.createElement('div');
            line.className = `debug-line ${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            content.appendChild(line);
            // Son 20 satırı tut
            while (content.children.length > 20) {
                content.removeChild(content.firstChild);
            }
        }

        async function fetchHEData(table, query = {}) {
            const payload = {
                jsonrpc: '2.0',
                id: Math.random(),
                method: 'find',
                params: {
                    contract: 'market',
                    table: table,
                    query: query,
                    limit: 1000
                }
            };

            const response = await fetch(HIVE_ENGINE_API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            return data.result || [];
        }

        async function fetchTDPools() {
            const payload = {
                jsonrpc: '2.0',
                id: Math.random(),
                method: 'find',
                params: {
                    contract: 'swap',
                    table: 'pools',
                    query: {},
                    limit: 1000
                }
            };

            const response = await fetch(HIVE_ENGINE_API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            return data.result || [];
        }

        function calculateArbitrage() {
            const minProfit = parseFloat(document.getElementById('minProfit').value) || 0;
            const swapFee = parseFloat(document.getElementById('swapFee').value) || 0.3;
            const filter = document.getElementById('filter').value;

            return async () => {
                document.getElementById('status').textContent = 'Veriler çekiliyor...';
                document.getElementById('debugContent').innerHTML = '';
                
                try {
                    logDebug('HE sellBook çekiliyor...', 'info');
                    const sellBook = await fetchHEData('sellBook');
                    logDebug(`HE sellBook: ${sellBook.length} kayıt`, 'success');
                    
                    logDebug('HE buyBook çekiliyor...', 'info');
                    const buyBook = await fetchHEData('buyBook');
                    logDebug(`HE buyBook: ${buyBook.length} kayıt`, 'success');
                    
                    logDebug('TD havuzları çekiliyor...', 'info');
                    const pools = await fetchTDPools();
                    logDebug(`TD havuzları: ${pools.length} kayıt`, 'success');
                    
                    // İlk 3 havuzu debug için göster
                    if (pools.length > 0) {
                        logDebug(`Örnek havuz: ${JSON.stringify(pools[0]).substring(0, 150)}...`, 'info');
                    }

                    // HE Market: En iyi satış fiyatı (en düşük ask)
                    const hePrices = {};
                    sellBook.forEach(order => {
                        const symbol = order.symbol;
                        const price = parseFloat(order.price);
                        if (!hePrices[symbol] || price < hePrices[symbol].ask) {
                            hePrices[symbol] = { ask: price };
                        }
                    });

                    // HE Market: En iyi alış fiyatı (en yüksek bid)
                    buyBook.forEach(order => {
                        const symbol = order.symbol;
                        const price = parseFloat(order.price);
                        if (!hePrices[symbol]) hePrices[symbol] = {};
                        if (!hePrices[symbol].bid || price > hePrices[symbol].bid) {
                            hePrices[symbol].bid = price;
                        }
                    });

                    logDebug(`HE'de ${Object.keys(hePrices).length} token bulundu`, 'success');

                    // TD Pools: Havuz fiyatları
                    const tdPrices = {};
                    pools.forEach(pool => {
                        // Havuz yapısı: baseSymbol/quoteSymbol
                        // Genellikle SWAP.HIVE baz, token quote olur
                        const baseSymbol = pool.baseSymbol;
                        const quoteSymbol = pool.quoteSymbol;
                        
                        // Fiyat = quoteQuantity / baseQuantity (base başına quote)
                        // Veya pool.price alanı varsa onu kullan
                        let price = null;
                        
                        if (pool.price) {
                            price = parseFloat(pool.price);
                        } else if (pool.baseQuantity && pool.quoteQuantity) {
                            const baseQty = parseFloat(pool.baseQuantity);
                            const quoteQty = parseFloat(pool.quoteQuantity);
                            if (baseQty > 0) {
                                price = quoteQty / baseQty;
                            }
                        }
                        
                        if (price && price > 0) {
                            // SWAP.HIVE baz ise, quote tokenin fiyatı
                            if (baseSymbol === 'SWAP.HIVE' && quoteSymbol) {
                                tdPrices[quoteSymbol] = price;
                            }
                            // Quote SWAP.HIVE ise, base tokenin fiyatı (ters)
                            else if (quoteSymbol === 'SWAP.HIVE' && baseSymbol) {
                                tdPrices[baseSymbol] = 1 / price;
                            }
                        }
                    });

                    logDebug(`TD'de ${Object.keys(tdPrices).length} token fiyatı bulundu`, 'success');
                    
                    // İlk 5 TD fiyatını göster
                    const tdKeys = Object.keys(tdPrices).slice(0, 5);
                    tdKeys.forEach(key => {
                        logDebug(`TD ${key}: ${tdPrices[key].toFixed(6)}`, 'info');
                    });

                    // Arbitraj hesapla
                    const opportunities = [];
                    let matchedCount = 0;
                    
                    Object.keys(hePrices).forEach(symbol => {
                        const he = hePrices[symbol];
                        const td = tdPrices[symbol];

                        if (!he.ask || !he.bid) return;
                        
                        if (!td) return; // TD'de fiyat yoksa atla
                        
                        matchedCount++;

                        // HE'den al, TD'de sat
                        // HE'de ask fiyatından alırsın, TD'de havuz fiyatından satarsın
                        const profitHEtoTD = ((td - he.ask) / he.ask) * 100 - swapFee;
                        
                        // TD'den al, HE'de sat
                        // TD'de havuz fiyatından alırsın, HE'de bid fiyatından satarsın
                        const profitTDtoHE = ((he.bid - td) / td) * 100 - swapFee;

                        if (filter === 'profit' && profitHEtoTD < minProfit && profitTDtoHE < minProfit) {
                            return;
                        }

                        if (profitHEtoTD >= minProfit || profitTDtoHE >= minProfit) {
                            opportunities.push({
                                symbol,
                                heAsk: he.ask,
                                heBid: he.bid,
                                tdPrice: td,
                                profitHEtoTD,
                                profitTDtoHE
                            });
                        }
                    });

                    logDebug(`Eşleşen token: ${matchedCount}`, 'info');
                    logDebug(`Fırsat bulundu: ${opportunities.length}`, opportunities.length > 0 ? 'success' : 'error');

                    // Kâr oranına göre sırala
                    opportunities.sort((a, b) => Math.max(b.profitHEtoTD, b.profitTDtoHE) - Math.max(a.profitHEtoTD, a.profitTDtoHE));

                    renderTable(opportunities);
                    document.getElementById('status').textContent = `Son güncelleme: ${new Date().toLocaleTimeString('tr-TR')} | ${opportunities.length} fırsat bulundu`;
                } catch (error) {
                    console.error('Hata:', error);
                    logDebug(`HATA: ${error.message}`, 'error');
                    document.getElementById('status').textContent = 'Hata: Veriler çekilemedi';
                }
            };
        }

        function renderTable(opportunities) {
            const tbody = document.getElementById('tableBody');
            
            if (opportunities.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="no-data">Şu an arbitraj fırsatı bulunmuyor (veya filtre kriterlerini karşılayan fırsat yok)</td></tr>';
                return;
            }

            tbody.innerHTML = opportunities.map(opp => {
                const profitHEtoTDClass = opp.profitHEtoTD > 0 ? 'profit' : (opp.profitHEtoTD < 0 ? 'loss' : 'neutral');
                const profitTDtoHEClass = opp.profitTDtoHE > 0 ? 'profit' : (opp.profitTDtoHE < 0 ? 'loss' : 'neutral');

                return `
                    <tr>
                        <td class="token-name">${opp.symbol}</td>
                        <td class="price">${opp.heAsk.toFixed(6)}</td>
                        <td class="price">${opp.heBid.toFixed(6)}</td>
                        <td class="price">${opp.tdPrice.toFixed(6)}</td>
                        <td class="${profitHEtoTDClass}">${opp.profitHEtoTD.toFixed(2)}%</td>
                        <td class="${profitTDtoHEClass}">${opp.profitTDtoHE.toFixed(2)}%</td>
                    </tr>
                `;
            }).join('');
        }

        function fetchData() {
            const fetchAndRender = calculateArbitrage();
            fetchAndRender();
        }

        // Sayfa yüklendiğinde ve her 30 saniyede bir güncelle
        window.addEventListener('load', () => {
            fetchData();
            updateInterval = setInterval(fetchData, 30000);
        });

        // Filtre değiştiğinde güncelle
        document.getElementById('minProfit').addEventListener('change', fetchData);
        document.getElementById('swapFee').addEventListener('change', fetchData);
        document.getElementById('filter').addEventListener('change', fetchData);
    </script>
</body>
</html>
