<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbitrage Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { color: #58a6ff; margin-bottom: 10px; font-size: 28px; }
        .subtitle { color: #8b949e; margin-bottom: 30px; font-size: 14px; }
        .controls {
            display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap;
            align-items: flex-end;
        }
        .controls > div { display: flex; flex-direction: column; gap: 4px; }
        .controls label { color: #8b949e; font-size: 12px; }
        .controls input, .controls select {
            background: #161b22; border: 1px solid #30363d;
            color: #c9d1d9; padding: 8px 12px; border-radius: 6px; font-size: 14px;
        }
        .controls button {
            background: #238636; color: white; border: none;
            padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px;
            height: 36px;
        }
        .controls button:hover { background: #2ea043; }
        .status { color: #8b949e; font-size: 12px; margin-bottom: 20px; }
        
        .debug-panel {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 11px;
            font-family: 'Courier New', monospace;
            max-height: 400px;
            overflow-y: auto;
        }
        .debug-panel h3 { color: #58a6ff; margin-bottom: 10px; font-size: 13px; }
        .debug-line { color: #8b949e; margin: 3px 0; word-break: break-all; }
        .debug-line.error { color: #f85149; }
        .debug-line.success { color: #3fb950; }
        .debug-line.info { color: #58a6ff; }
        .debug-line.raw { color: #d2a8ff; font-size: 10px; }
        
        table {
            width: 100%; border-collapse: collapse;
            background: #161b22; border-radius: 8px; overflow: hidden;
        }
        th {
            background: #21262d; color: #58a6ff;
            padding: 12px; text-align: left; font-size: 13px; font-weight: 600;
        }
        td { padding: 12px; border-bottom: 1px solid #21262d; font-size: 13px; }
        tr:hover { background: #1c2128; }
        .profit { color: #3fb950; font-weight: 600; }
        .loss { color: #f85149; }
        .neutral { color: #8b949e; }
        .token-name { font-weight: 600; color: #c9d1d9; }
        .price { font-family: 'Courier New', monospace; }
        .no-data { text-align: center; padding: 40px; color: #8b949e; }
        .loading { text-align: center; padding: 40px; color: #58a6ff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Arbitrage Tracker (HE vs TD)</h1>
        <p class="subtitle">Hive Engine Market ve TribalDex Havuzları arası gerçek arbitraj fırsatları</p>
        
        <div class="controls">
            <div>
                <label>İşlem Boyutu (SWAP.HIVE):</label>
                <select id="tradeSize">
                    <option value="10">10 HIVE (Düşük slippage)</option>
                    <option value="50">50 HIVE</option>
                    <option value="100" selected>100 HIVE (Orta)</option>
                    <option value="500">500 HIVE</option>
                    <option value="1000">1000 HIVE (Yüksek slippage)</option>
                </select>
            </div>
            <div>
                <label>Minimum Kâr (%):</label>
                <input type="number" id="minProfit" value="0" min="0" step="0.1">
            </div>
            <div>
                <label>Swap/Network Ücreti (%):</label>
                <input type="number" id="swapFee" value="0.5" min="0" step="0.1">
            </div>
            <div>
                <label>Filtre:</label>
                <select id="filter">
                    <option value="all">Tümü</option>
                    <option value="profit">Sadece Kârlı</option>
                </select>
            </div>
            <button onclick="fetchData()">Yenile</button>
        </div>
        
        <div class="status" id="status">Yükleniyor...</div>
        
        <div class="debug-panel" id="debugPanel">
            <h3>🔍 Debug Bilgisi</h3>
            <div id="debugContent">Başlatılıyor...</div>
        </div>
        
        <table id="arbitrageTable">
            <thead>
                <tr>
                    <th>Token</th>
                    <th>HE ASK (Satış)</th>
                    <th>HE BID (Alış)</th>
                    <th>TD BUY / SELL</th>
                    <th>HE → TD Kâr</th>
                    <th>TD → HE Kâr</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="6" class="loading">Veriler yükleniyor...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const HIVE_ENGINE_API = 'https://api.hive-engine.com/rpc/contracts';
        let updateInterval;

        function logDebug(message, type = 'info') {
            const content = document.getElementById('debugContent');
            const line = document.createElement('div');
            line.className = `debug-line ${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            content.appendChild(line);
            while (content.children.length > 60) {
                content.removeChild(content.firstChild);
            }
        }

        // Virgül/Nokta farkına karşı güvenli parse
        function safeParseFloat(value) {
            if (value === null || value === undefined || value === '') return null;
            const normalized = String(value).replace(/,/g, '.');
            const parsed = parseFloat(normalized);
            return isNaN(parsed) ? null : parsed;
        }

        async function apiCall(method, params) {
            const payload = {
                jsonrpc: '2.0',
                id: Math.random(),
                method: method,
                params: params
            };
            const response = await fetch(HIVE_ENGINE_API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            return await response.json();
        }

        async function fetchHEData(table) {
            const result = await apiCall('find', {
                contract: 'market',
                table: table,
                query: {},
                limit: 1000
            });
            return result.result || [];
        }

        async function fetchTDPools() {
            const result = await apiCall('find', {
                contract: 'marketpools',
                table: 'pools',
                query: {},
                limit: 1000
            });
            return result.result || [];
        }

        function calculateArbitrage() {
            // 🎯 İŞLEM BOYUTUNU KULLANICIDAN AL
            const tradeSize = parseFloat(document.getElementById('tradeSize').value) || 100;
            const minProfit = parseFloat(document.getElementById('minProfit').value) || 0;
            const swapFee = parseFloat(document.getElementById('swapFee').value) || 0.5;
            const filter = document.getElementById('filter').value;

            return async () => {
                document.getElementById('status').textContent = 'Veriler çekiliyor...';
                document.getElementById('debugContent').innerHTML = '';
                
                try {
                    logDebug(`HE sellBook çekiliyor...`, 'info');
                    const sellBook = await fetchHEData('sellBook');
                    logDebug(`HE sellBook: ${sellBook.length} emir`, 'success');
                    
                    logDebug('HE buyBook çekiliyor...', 'info');
                    const buyBook = await fetchHEData('buyBook');
                    logDebug(`HE buyBook: ${buyBook.length} emir`, 'success');
                    
                    logDebug('TD havuzları çekiliyor...', 'info');
                    const pools = await fetchTDPools();
                    logDebug(`TD havuzları: ${pools.length} kayıt`, 'success');

                    // 1. HE Fiyatlarını Hesapla (En iyi ASK ve BID)
                    const hePrices = {};
                    sellBook.forEach(order => {
                        const symbol = order.symbol;
                        const price = safeParseFloat(order.price);
                        if (!price || price <= 0) return;
                        if (!hePrices[symbol] || price < hePrices[symbol].ask) {
                            hePrices[symbol] = { ask: price };
                        }
                    });
                    buyBook.forEach(order => {
                        const symbol = order.symbol;
                        const price = safeParseFloat(order.price);
                        if (!price || price <= 0) return;
                        if (!hePrices[symbol]) hePrices[symbol] = {};
                        if (!hePrices[symbol].bid || price > hePrices[symbol].bid) {
                            hePrices[symbol].bid = price;
                        }
                    });
                    logDebug(`HE'de ${Object.keys(hePrices).length} token bulundu`, 'success');

                    // 2. TD Fiyatlarını Hesapla (Seçilen işlem boyutuna göre AMM BUY/SELL)
                    const tdBuyPrices = {};
                    const tdSellPrices = {};
                    
                    pools.forEach(pool => {
                        const tokenPair = pool.tokenPair;
                        if (!tokenPair) return;
                        const parts = tokenPair.split(':');
                        if (parts.length !== 2) return;
                        
                        const baseSymbol = parts[0];
                        const quoteSymbol = parts[1];
                        
                        const baseQty = safeParseFloat(pool.baseQuantity);
                        const quoteQty = safeParseFloat(pool.quoteQuantity);
                        
                        if (!baseQty || !quoteQty || baseQty <= 0 || quoteQty <= 0) return;
                        
                        let tokenSymbol = null;
                        let isBaseHive = false;
                        
                        if (baseSymbol === 'SWAP.HIVE') {
                            tokenSymbol = quoteSymbol;
                            isBaseHive = true;
                        } else if (quoteSymbol === 'SWAP.HIVE') {
                            tokenSymbol = baseSymbol;
                            isBaseHive = false;
                        } else {
                            return; // Sadece SWAP.HIVE pairlerini al
                        }

                        // AMM Formülü (x * y = k) - SEÇİLEN İŞLEM BOYUTUNA GÖRE
                        const k = baseQty * quoteQty;
                        
                        // TD BUY: SWAP.HIVE ver, Token al
                        let tokensReceived = 0;
                        if (isBaseHive) {
                            const newBase = baseQty + tradeSize;
                            const newQuote = k / newBase;
                            tokensReceived = quoteQty - newQuote;
                        } else {
                            const newQuote = quoteQty + tradeSize;
                            const newBase = k / newQuote;
                            tokensReceived = baseQty - newBase;
                        }
                        
                        if (tokensReceived <= 0) return;
                        const tdBuyPrice = tradeSize / tokensReceived;
                        
                        // TD SELL: Aldığın Tokeni geri sat, SWAP.HIVE al
                        let hiveReceived = 0;
                        if (isBaseHive) {
                            const newQuoteSell = quoteQty + tokensReceived;
                            const newBaseSell = k / newQuoteSell;
                            hiveReceived = baseQty - newBaseSell;
                        } else {
                            const newBaseSell = baseQty + tokensReceived;
                            const newQuoteSell = k / newBaseSell;
                            hiveReceived = quoteQty - newQuoteSell;
                        }
                        
                        const tdSellPrice = hiveReceived / tokensReceived;
                        
                        tdBuyPrices[tokenSymbol] = tdBuyPrice;
                        tdSellPrices[tokenSymbol] = tdSellPrice;
                    });
                    
                    logDebug(`TD'de ${Object.keys(tdBuyPrices).length} token fiyatı hesaplandı (İşlem boyutu: ${tradeSize} HIVE)`, 'success');

                    // 3. Arbitraj Hesapla
                    const opportunities = [];
                    let matchedCount = 0;
                    
                    Object.keys(hePrices).forEach(symbol => {
                        const he = hePrices[symbol];
                        const tdBuy = tdBuyPrices[symbol];
                        const tdSell = tdSellPrices[symbol];

                        if (!he.ask || !he.bid || !tdBuy || !tdSell) return;
                        matchedCount++;

                        // Senaryo 1: HE'den al (ASK), TD'de sat (SELL)
                        const profitHEtoTD = ((tdSell - he.ask) / he.ask) * 100 - swapFee;
                        
                        // Senaryo 2: TD'den al (BUY), HE'de sat (BID)
                        const profitTDtoHE = ((he.bid - tdBuy) / tdBuy) * 100 - swapFee;

                        if (filter === 'profit' && profitHEtoTD < minProfit && profitTDtoHE < minProfit) {
                            return;
                        }

                        if (profitHEtoTD >= minProfit || profitTDtoHE >= minProfit) {
                            opportunities.push({
                                symbol,
                                heAsk: he.ask,
                                heBid: he.bid,
                                tdBuy: tdBuy,
                                tdSell: tdSell,
                                profitHEtoTD,
                                profitTDtoHE
                            });
                        }
                    });

                    logDebug(`Eşleşen token: ${matchedCount}`, 'info');
                    logDebug(`Fırsat bulundu: ${opportunities.length}`, opportunities.length > 0 ? 'success' : 'error');

                    // Kâra göre sırala
                    opportunities.sort((a, b) => Math.max(b.profitHEtoTD, b.profitTDtoHE) - Math.max(a.profitHEtoTD, a.profitTDtoHE));

                    renderTable(opportunities);
                    document.getElementById('status').textContent = `Son güncelleme: ${new Date().toLocaleTimeString('tr-TR')} | ${opportunities.length} fırsat bulundu (İşlem boyutu: ${tradeSize} SWAP.HIVE)`;
                } catch (error) {
                    console.error('Hata:', error);
                    logDebug(`HATA: ${error.message}`, 'error');
                    document.getElementById('status').textContent = 'Hata: Veriler çekilemedi';
                }
            };
        }

        function renderTable(opportunities) {
            const tbody = document.getElementById('tableBody');
            
            if (opportunities.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="no-data">Şu an arbitraj fırsatı bulunmuyor (veya filtre kriterlerini karşılayan fırsat yok)</td></tr>';
                return;
            }

            tbody.innerHTML = opportunities.map(opp => {
                const profitHEtoTDClass = opp.profitHEtoTD > 0 ? 'profit' : (opp.profitHEtoTD < 0 ? 'loss' : 'neutral');
                const profitTDtoHEClass = opp.profitTDtoHE > 0 ? 'profit' : (opp.profitTDtoHE < 0 ? 'loss' : 'neutral');

                return `
                    <tr>
                        <td class="token-name">${opp.symbol}</td>
                        <td class="price">${opp.heAsk.toFixed(8)}</td>
                        <td class="price">${opp.heBid.toFixed(8)}</td>
                        <td class="price">${opp.tdBuy.toFixed(8)} / ${opp.tdSell.toFixed(8)}</td>
                        <td class="${profitHEtoTDClass}">${opp.profitHEtoTD.toFixed(2)}%</td>
                        <td class="${profitTDtoHEClass}">${opp.profitTDtoHE.toFixed(2)}%</td>
                    </tr>
                `;
            }).join('');
        }

        function fetchData() {
            const fetchAndRender = calculateArbitrage();
            fetchAndRender();
        }

        window.addEventListener('load', () => {
            fetchData();
            updateInterval = setInterval(fetchData, 30000);
        });

        // 🎯 İŞLEM BOYUTU DEĞİŞTİĞİNDE OTOMATİK YENİLE
        document.getElementById('tradeSize').addEventListener('change', fetchData);
        document.getElementById('minProfit').addEventListener('change', fetchData);
        document.getElementById('swapFee').addEventListener('change', fetchData);
        document.getElementById('filter').addEventListener('change', fetchData);
    </script>
</body>
</html>
